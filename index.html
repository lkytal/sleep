<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="睡眠质量追踪应用 — 记录和分析您的睡眠数据">
  <title>睡眠追踪器</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
</head>
<body>
  <nav id="main-nav">
    <div class="nav-brand"><span class="nav-icon">🌙</span><span class="nav-title">睡眠追踪器</span></div>
    <div class="nav-tabs">
      <button id="nav-dashboard" class="nav-tab active" onclick="App.showPage('dashboard')">📊 概览</button>
      <button id="nav-analysis" class="nav-tab" onclick="App.showPage('analysis')">🔬 分析</button>
      <button id="nav-record" class="nav-tab" onclick="Record.open()">+ 新记录</button>
    </div>
    <div class="nav-actions">
      <button id="btn-pick-file" class="nav-btn" onclick="Data.pickFile()">📂 选择文件</button>
      <button id="btn-import" class="nav-btn" onclick="Data.importData()">导入</button>
      <button id="btn-export" class="nav-btn" onclick="Data.exportData()">导出</button>
    </div>
  </nav>
  <main id="app-container">
    <section id="page-dashboard" class="page active">
      <div class="dashboard-header">
        <h1>睡眠概览</h1>
        <div class="window-selector">
          <button class="window-btn active" data-days="7" onclick="Dashboard.setWindow(7,this)">7天</button>
          <button class="window-btn" data-days="14" onclick="Dashboard.setWindow(14,this)">14天</button>
          <button class="window-btn" data-days="30" onclick="Dashboard.setWindow(30,this)">30天</button>
          <button class="window-btn" data-days="0" onclick="Dashboard.setWindow(0,this)">全部</button>
        </div>
      </div>
      <div class="chart-container"><canvas id="sleep-chart"></canvas></div>
      <div class="chart-legend" id="chart-legend"></div>
      <div class="recent-records" id="recent-records"></div>
    </section>
    <section id="page-analysis" class="page">
      <div class="dashboard-header">
        <h1>🔬 药物回归分析</h1>
        <div class="analysis-mode-selector">
          <button class="analysis-mode-btn active" onclick="Analysis.setMode('meds',this)">💊 药物分析</button>
          <button class="analysis-mode-btn" onclick="Analysis.setMode('full',this)">📊 综合分析</button>
        </div>
      </div>
      <p class="analysis-desc">使用 <strong>有序混合效应模型</strong>（累积Logit / 比例优势模型 + 星期随机截距）。<br><strong>💊 药物分析</strong>：药物是否服用 + 时间偏移。<strong>📊 综合分析</strong>：额外纳入当日有效睡眠、前日有效睡眠和前日评分。<br>系数为log-odds，OR &gt; 1 表示该特征与更高评分等级相关。</p>
      <div class="analysis-stats" id="analysis-stats"></div>
      <div class="chart-container analysis-chart-container"><canvas id="analysis-chart"></canvas></div>
      <div class="analysis-legend">
        <div class="legend-item"><span class="legend-dot" style="background:#55efc4"></span>是否服用 (正向)</div>
        <div class="legend-item"><span class="legend-dot" style="background:#e17055"></span>是否服用 (负向)</div>
        <div class="legend-item"><span class="legend-dot" style="background:#74b9ff"></span>时间偏移 (正向)</div>
        <div class="legend-item"><span class="legend-dot" style="background:#fdcb6e"></span>时间偏移 (负向)</div>
        <div class="legend-item"><span class="legend-dot" style="background:#a29bfe"></span>睡眠特征 (正向)</div>
        <div class="legend-item"><span class="legend-dot" style="background:#ffeaa7"></span>睡眠特征 (负向)</div>
      </div>
    </section>
  </main>
  <!-- Record Modal -->
  <div id="record-modal" class="modal-overlay" onclick="Record.handleOverlayClick(event)">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modal-title">记录睡眠</h2>
        <button class="modal-close" onclick="Record.close()">&times;</button>
      </div>
      <div class="modal-body">
        <div class="record-date-row"><label>记录日期</label><input type="date" id="record-date"></div>
        <div class="record-row time-row">
          <div class="time-card">
            <label>入睡时间</label>
            <div class="time-picker" id="bedtime-picker">
              <div class="time-wheel" data-field="bedtime-hour" data-min="0" data-max="23" data-step="1">
                <span class="time-value" id="bedtime-hour">23</span><span class="time-label">时</span>
              </div>
              <span class="time-sep">:</span>
              <div class="time-wheel" data-field="bedtime-min" data-min="0" data-max="50" data-step="10">
                <span class="time-value" id="bedtime-min">00</span><span class="time-label">分</span>
              </div>
            </div>
          </div>
          <div class="time-card">
            <label>起床时间</label>
            <div class="time-picker" id="waketime-picker">
              <div class="time-wheel" data-field="wake-hour" data-min="0" data-max="23" data-step="1">
                <span class="time-value" id="wake-hour">07</span><span class="time-label">时</span>
              </div>
              <span class="time-sep">:</span>
              <div class="time-wheel" data-field="wake-min" data-min="0" data-max="50" data-step="10">
                <span class="time-value" id="wake-min">00</span><span class="time-label">分</span>
              </div>
            </div>
          </div>
          <div class="time-card sleep-duration-card">
            <label>有效睡眠时长</label>
            <div class="duration-display" id="duration-display">7h 00m</div>
            <input type="range" id="duration-slider" min="300" max="600" step="15" value="420" oninput="Record.updateDurationDisplay(this.value)">
            <div class="slider-labels"><span>5h</span><span>10h</span></div>
          </div>
        </div>
        <div class="record-row detail-row">
          <div class="detail-card score-card">
            <label>睡眠评分</label>
            <div class="score-display" id="score-display">7.0</div>
            <input type="range" id="score-slider" min="1" max="10" step="0.5" value="7" oninput="Record.updateScoreDisplay(this.value)">
            <div class="slider-labels"><span>1</span><span>10</span></div>
            <div class="score-emoji" id="score-emoji">😊</div>
          </div>
          <div class="detail-card tags-card">
            <label>睡眠描述</label>
            <div class="tags-container" id="tags-container"></div>
          </div>
          <div class="detail-card meds-card">
            <label>药物记录</label>
            <div class="meds-container" id="meds-container"></div>
          </div>
        </div>
        <div class="record-actions">
          <button id="btn-save" class="btn-primary" onclick="Record.save()">保存记录</button>
        </div>
      </div>
    </div>
  </div>
  <div id="toast" class="toast"></div>
  <input type="file" id="import-file" accept=".json" style="display:none" onchange="Data.handleImport(event)">
  <script src="js/data.js"></script>
  <script src="js/record.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/analysis.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
