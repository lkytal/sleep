<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="睡眠质量追踪应用 — 记录和分析您的睡眠数据">
  <title>睡眠追踪器</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
</head>
<body>
  <nav id="main-nav">
    <div class="nav-brand"><span class="nav-icon">🌙</span><span class="nav-title">睡眠追踪器</span></div>
    <div class="nav-tabs">
      <button id="nav-dashboard" class="nav-tab active" onclick="App.showPage('dashboard')">📊 概览</button>
      <button id="nav-analysis" class="nav-tab" onclick="App.showPage('analysis')">🔬 分析</button>
      <button id="nav-record" class="nav-tab" onclick="Record.open()">+ 新记录</button>
    </div>
    <div class="nav-actions">
      <button id="btn-pick-file" class="nav-btn" onclick="Data.pickFile()">📂 选择文件</button>
      <button id="btn-import" class="nav-btn" onclick="Data.importData()">导入</button>
      <button id="btn-export" class="nav-btn" onclick="Data.exportData()">导出</button>
    </div>
  </nav>
  <main id="app-container">
    <section id="page-dashboard" class="page active">
      <div class="dashboard-header">
        <h1>睡眠概览</h1>
        <div class="window-selector">
          <button class="window-btn" data-days="7" onclick="Dashboard.setWindow(7,this)">7天</button>
          <button class="window-btn" data-days="14" onclick="Dashboard.setWindow(14,this)">14天</button>
          <button class="window-btn active" data-days="30" onclick="Dashboard.setWindow(30,this)">30天</button>
          <button class="window-btn" data-days="0" onclick="Dashboard.setWindow(0,this)">全部</button>
        </div>
      </div>
      <div class="chart-container"><canvas id="sleep-chart"></canvas></div>
      <div class="chart-legend" id="chart-legend"></div>
      <div class="recent-records" id="recent-records"></div>
    </section>
    <section id="page-analysis" class="page">
      <div class="analysis-toolbar">
        <div class="analysis-toolbar-top">
          <h1>🔬 睡眠回归分析</h1>
          <div class="window-selector">
            <button class="window-btn" data-days="7" onclick="Analysis.setWindow(7,this)">7天</button>
            <button class="window-btn" data-days="14" onclick="Analysis.setWindow(14,this)">14天</button>
            <button class="window-btn" data-days="30" onclick="Analysis.setWindow(30,this)">30天</button>
            <button class="window-btn active" data-days="0" onclick="Analysis.setWindow(0,this)">全部</button>
          </div>
        </div>
        <p class="analysis-subtitle">有序混合效应模型（累积Logit + 星期随机截距）· 系数为log-odds · OR &gt; 1 → 更高评分</p>
        <div class="analysis-features" id="analysis-features"></div>
        <div class="analysis-stats" id="analysis-stats"></div>
      </div>
      <div class="chart-container analysis-chart-container"><canvas id="analysis-chart"></canvas></div>
      <div class="analysis-legend" id="analysis-legend"></div>
    </section>
  </main>
  <!-- Record Modal -->
  <div id="record-modal" class="modal-overlay" onclick="Record.handleOverlayClick(event)">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modal-title">记录睡眠</h2>
        <button class="modal-close" onclick="Record.close()">&times;</button>
      </div>
      <div class="modal-body compact">
        <!-- Row 1: Date + Duration + Score -->
        <div class="record-row top-row">
          <div class="compact-card date-card">
            <label>📅 日期</label>
            <div class="date-picker" id="date-picker">
              <div class="time-wheel" data-field="date-year" data-min="2024" data-max="2030" data-step="1">
                <span class="time-value" id="date-year">2026</span><span class="time-label">年</span>
              </div>
              <div class="time-wheel" data-field="date-month" data-min="1" data-max="12" data-step="1">
                <span class="time-value" id="date-month">01</span><span class="time-label">月</span>
              </div>
              <div class="time-wheel" data-field="date-day" data-min="1" data-max="31" data-step="1">
                <span class="time-value" id="date-day">01</span><span class="time-label">日</span>
              </div>
            </div>
          </div>
          <div class="compact-card duration-wheel-card">
            <label>⏱ 有效睡眠</label>
            <div class="duration-picker" id="duration-picker">
              <div class="time-wheel" data-field="dur-hour" data-min="3" data-max="12" data-step="1">
                <span class="time-value" id="dur-hour">07</span><span class="time-label">时</span>
              </div>
              <div class="time-wheel" data-field="dur-min" data-min="0" data-max="45" data-step="15">
                <span class="time-value" id="dur-min">00</span><span class="time-label">分</span>
              </div>
            </div>
          </div>
          <div class="compact-card score-wheel-card">
            <label>⭐ 评分</label>
            <div class="score-picker" id="score-picker">
              <div class="time-wheel score-wheel" data-field="score-val" data-min="1.0" data-max="10.0" data-step="0.5">
                <span class="time-value" id="score-val">7.0</span>
              </div>
              <span class="score-emoji-inline" id="score-emoji">😊</span>
            </div>
          </div>
        </div>
        <!-- Row 2: Bedtime + Wake time -->
        <div class="record-row time-row">
          <div class="compact-card">
            <label>🌙 入睡</label>
            <div class="time-picker" id="bedtime-picker">
              <div class="time-wheel" data-field="bedtime-hour" data-min="0" data-max="23" data-step="1">
                <span class="time-value" id="bedtime-hour">23</span><span class="time-label">时</span>
              </div>
              <span class="time-sep">:</span>
              <div class="time-wheel" data-field="bedtime-min" data-min="0" data-max="50" data-step="10">
                <span class="time-value" id="bedtime-min">00</span><span class="time-label">分</span>
              </div>
            </div>
          </div>
          <div class="compact-card">
            <label>☀️ 起床</label>
            <div class="time-picker" id="waketime-picker">
              <div class="time-wheel" data-field="wake-hour" data-min="0" data-max="23" data-step="1">
                <span class="time-value" id="wake-hour">07</span><span class="time-label">时</span>
              </div>
              <span class="time-sep">:</span>
              <div class="time-wheel" data-field="wake-min" data-min="0" data-max="50" data-step="10">
                <span class="time-value" id="wake-min">00</span><span class="time-label">分</span>
              </div>
            </div>
          </div>
          <div class="compact-card bio-card">
            <label>📊 生理指标 <span class="optional-badge">可选</span></label>
            <div class="bio-row">
              <div class="bio-item">
                <span class="bio-label">HRV</span>
                <input type="number" id="bio-hrv" class="bio-input" placeholder="—" min="0" max="300" step="1">
                <span class="bio-unit">ms</span>
              </div>
              <div class="bio-item">
                <span class="bio-label">静息心率</span>
                <input type="number" id="bio-rhr" class="bio-input" placeholder="—" min="30" max="150" step="1">
                <span class="bio-unit">bpm</span>
              </div>
              <div class="bio-item">
                <span class="bio-label">深睡比</span>
                <input type="number" id="bio-deep" class="bio-input" placeholder="—" min="0" max="100" step="1">
                <span class="bio-unit">%</span>
              </div>
            </div>
          </div>
        </div>
        <!-- Row 3: Tags + Events + Meds -->
        <div class="record-row detail-row">
          <div class="compact-card tags-card">
            <label>💤 睡眠描述</label>
            <div class="tags-container" id="tags-container"></div>
          </div>
          <div class="compact-card events-card">
            <label>📝 睡眠事件</label>
            <div class="tags-container" id="events-container"></div>
          </div>
          <div class="compact-card meds-card">
            <label>💊 药物记录</label>
            <div class="meds-container" id="meds-container"></div>
          </div>
        </div>
        <div class="record-actions">
          <button id="btn-save" class="btn-primary" onclick="Record.save()">保存记录</button>
        </div>
      </div>
    </div>
  </div>
  <div id="toast" class="toast"></div>
  <input type="file" id="import-file" accept=".json" style="display:none" onchange="Data.handleImport(event)">
  <script src="js/data.js"></script>
  <script src="js/record.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/analysis.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
